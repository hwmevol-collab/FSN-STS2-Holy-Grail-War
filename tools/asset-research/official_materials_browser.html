<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSN 官方资料库</title><!--BASE-->
<style>
:root{--ink:#21384b;--muted:#526778;--paper:#edf2f6;--surface:#fff;--line:#bdcad6;--accent:#793d58;--focus:#ab5d21}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI","Yu Gothic UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button,a{cursor:pointer}button,input,select{min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:8px 12px}button:hover,a:hover{color:var(--accent)}button:disabled{opacity:.5;cursor:default}a{color:var(--ink);text-underline-offset:3px}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}header{padding:26px 32px 20px;background:var(--surface);border-bottom:1px solid var(--line)}h1{font:500 32px/1.2 Georgia,"Yu Mincho",serif;margin:0 0 8px}header p{margin:0;color:var(--muted)}.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:22px 0 0}.book{display:flex;align-items:center;gap:10px;text-align:left;min-width:0;border:0;border-left:4px solid var(--line);padding:8px;background:var(--paper)}.book[aria-pressed=true]{border-color:var(--accent);background:#f3eaf0}.book img{width:48px;height:67px;object-fit:contain}.book strong{display:block;font-size:15px}.book small{color:var(--muted);display:block}main{display:grid;grid-template-columns:235px minmax(0,1fr);gap:24px;padding:24px 32px;max-width:1800px;margin:auto}aside{align-self:start;position:static}label{display:block;font-size:14px;font-weight:600;margin:0 0 7px}aside select,aside input{width:100%;margin-bottom:17px}.minor{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:240px}.search input{width:100%}.pager{display:flex;gap:10px;align-items:center}.results-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:22px}.card{background:var(--surface);overflow:hidden;border:1px solid var(--line);border-radius:4px}.thumb{border:0;border-radius:0;width:100%;height:245px;padding:12px;background:#dde5ec;display:flex;align-items:center;justify-content:center}.thumb img{max-width:100%;height:100%;object-fit:contain}.body{padding:14px}.body h2{font-size:15px;margin:0 0 8px}.id{font-size:14px;font-weight:650;color:var(--accent);border:0;background:transparent;padding:0;min-height:36px}.meta{font-size:13px;line-height:1.7;color:var(--muted)}.roles{margin:8px 0;color:var(--ink);font-size:13px}.excerpt{font-size:13px;max-height:58px;overflow:hidden;margin:8px 0;color:var(--muted);overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}.empty{padding:50px;text-align:center;grid-column:1/-1}.footer{display:flex;justify-content:center;margin:28px 0}details{margin-top:20px}summary{cursor:pointer;min-height:44px}.toclink{display:block;margin:5px 0;border:0;text-align:left;background:transparent;font-size:13px;width:100%}.sheet{display:block;margin:7px 0;font-size:13px}dialog{border:0;border-radius:6px;padding:0;width:min(1300px,96vw);height:94vh;max-height:94vh;background:var(--surface);color:var(--ink)}dialog::backdrop{background:#172a40c9}.viewtop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}.viewlayout{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(94vh - 80px)}.pagecanvas{background:#c9d4df;overflow:auto;padding:18px;text-align:center}.pagecanvas img{width:100%;height:auto;max-width:100%;object-fit:contain}.pageinfo{overflow:auto;padding:18px}.pageinfo h2{font-size:18px;margin-top:0}.pageinfo pre{white-space:pre-wrap;font:14px/1.7 "Segoe UI","Yu Gothic UI",sans-serif;overflow-wrap:anywhere}.notice{background:#f3eaf0;padding:9px;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:4px;padding:12px 20px;z-index:10}.toast:empty{display:none}@media(max-width:1000px){.shelf{grid-template-columns:repeat(3,1fr)}main{grid-template-columns:200px minmax(0,1fr);padding:20px}.viewlayout{grid-template-columns:minmax(0,1fr) 260px}}@media(max-width:650px){header{padding:20px 16px}h1{font-size:27px}.shelf{grid-template-columns:repeat(2,1fr)}main{display:block;padding:18px 16px}aside{position:static;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}aside details,aside p,aside button{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.thumb{height:195px}.body{padding:10px}.search{min-width:0;width:100%}.viewlayout{display:block;overflow:auto}.pageinfo{overflow:visible}.viewtop{flex-wrap:wrap;padding:10px}.pager{gap:6px}.book strong{font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><h1>Fate 官方资料库</h1><p>Complete Material I–V · Side Material　<span id="library-count"></span></p><nav class="shelf" id="shelf" aria-label="选择资料书"></nav></header>
<main><aside aria-label="筛选资料"><div><label for="book">书籍 / 卷</label><select id="book"><option value="">全部六本</option></select></div><div><label for="variant">扫描版本</label><select id="variant"><option value="PRIMARY">主扫描</option><option value="">全部版本</option><option value="ALT01">备用扫描 1</option></select></div><div><label for="section">章节</label><select id="section"><option value="">所有章节</option></select></div><div><label for="role">页面用途</label><select id="role"><option value="">所有用途</option></select></div><div><label for="character">角色</label><select id="character"><option value="">所有角色</option></select></div><div><label for="certainty">角色证据</label><select id="certainty"><option value="">已确认文字 + 候选</option><option value="confirmed">只看已确认文字引用</option><option value="candidate">只看候选 / 章节上下文</option></select></div><div><label for="scan">扫描页序</label><input id="scan" type="number" min="1" placeholder="例如 83"></div><div><label for="printed">印刷页码</label><input id="printed" type="number" min="1" placeholder="只查已核实页码"></div><button id="reset">清除筛选</button><p class="minor">章节角色表示上下文。已确认姓名指页面文字引用，图中人物仍需查看原页。</p><details><summary>本书目录</summary><div id="toc"></div></details><details><summary>Contact Sheets</summary><div id="sheets"></div></details><details><summary>索引与来源</summary><p><a href="Metadata/OFFICIAL_MATERIAL_PAGE_INDEX.csv">页面索引</a></p><p><a href="Metadata/OFFICIAL_MATERIAL_TOC.csv">目录索引</a></p><p><a href="Metadata/OFFICIAL_MATERIAL_TAG_EVIDENCE.csv">标签证据</a></p><p><a href="Metadata/BOOK_SOURCE_INVENTORY.csv">源资料清单</a></p></details></aside>
<section aria-label="页面检索"><div class="toolbar"><div class="search"><label for="query">搜索资料</label><input id="query" type="search" placeholder="Saber、遠坂、Gae Bolg、令呪、Projection、FSN268505…" autocomplete="off"></div><button id="search">搜索</button></div><div class="results-top"><div id="count" role="status" aria-live="polite"></div><div class="pager"><button id="prev">上一组</button><span id="pagination"></span><button id="next">下一组</button></div></div><div class="grid" id="grid"></div><div class="footer"><button id="next-bottom">下一组页面</button></div></section></main>
<dialog id="viewer" aria-label="按书翻页"><div class="viewtop"><div id="view-title"></div><div class="pager"><button id="book-prev">上一页</button><button id="book-next">下一页</button><button id="close">关闭</button></div></div><div class="viewlayout"><div class="pagecanvas"><img id="fullpage" alt="官方资料扫描原页"></div><div class="pageinfo" id="pageinfo"></div></div></dialog><div class="toast" id="toast" role="status"></div>
<script src="catalog.js"></script><script>
const $=id=>document.getElementById(id),data=window.OFFICIAL_MATERIALS,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=0,filtered=[],current=null;const pageSize=48;
const labels={CM_I:'I · 美术',CM_II:'II · 角色',CM_III:'III · 世界',CM_IV:'IV · 扩展',CM_V:'V · Hollow',SIDE:'Side · 早期资料'};
function options(id,values){const old=$(id).value;$(id).innerHTML='<option value="">'+(id==='section'?'所有章节':id==='character'?'所有角色':'所有用途')+'</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');$(id).value=values.includes(old)?old:''}
$('book').innerHTML+=[...new Set(data.pages.map(p=>p.book_id))].map(b=>`<option value="${b}">${esc(labels[b])}</option>`).join('');$('library-count').textContent=data.pages.length.toLocaleString()+' 个页面条目';
$('shelf').innerHTML=Object.keys(labels).map(b=>{let p=data.pages.find(p=>p.book_id===b&&p.scan_variant==='PRIMARY');return `<button class="book" data-book="${b}" aria-pressed="false"><img src="${p.thumbnail}" alt="${esc(labels[b])}封面"><span><strong>${esc(labels[b])}</strong><small>${data.pages.filter(p=>p.book_id===b&&p.scan_variant==='PRIMARY').length} 扫描页</small></span></button>`}).join('');
function updateBook(){const b=$('book').value;options('section',[...new Set(data.pages.filter(p=>!b||p.book_id===b).map(p=>p.section).filter(Boolean))]);document.querySelectorAll('.book').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.book===b)));$('toc').innerHTML=(b?data.toc.filter(t=>t.book_id===b&&t.scan_variant==='PRIMARY'):[]).map(t=>`<button class="toclink" data-scan="${t.scan_page_start}">印刷 ${t.printed_page_start}　${esc(t.section_title)}</button>`).join('')||'<p class="minor">选择一本书查看目录。</p>';$('sheets').innerHTML=(b?data.sheets.filter(t=>t.book_id===b):[]).map(t=>`<a class="sheet" href="${t.path}" target="_blank" rel="noopener">${esc(t.scan_variant)} · 扫描 ${t.scan_start}–${t.scan_end}</a>`).join('')||'<p class="minor">选择一本书查看 Contact Sheet。</p>';apply()}
options('role',[...new Set(data.pages.flatMap(p=>p.page_role))].sort());options('character',[...new Set(data.pages.flatMap(p=>p.characters_confirmed.concat(p.characters_candidate)))].sort());
const expandedTerms=q=>{let qs=[q];for(const a of data.aliases)if(a.alias.toLowerCase()===q||a.entity.toLowerCase()===q)qs.push(a.entity.toLowerCase(),...data.aliases.filter(x=>x.entity===a.entity).map(x=>x.alias.toLowerCase()));return [...new Set(qs)]};
function apply(){page=0;const b=$('book').value,v=$('variant').value,s=$('section').value,role=$('role').value,char=$('character').value,c=$('certainty').value,scan=$('scan').value,printed=$('printed').value,q=$('query').value.trim().normalize('NFKC').toLowerCase(),qs=expandedTerms(q);filtered=data.pages.filter(p=>(!b||p.book_id===b)&&(!v||p.scan_variant===v)&&(!s||p.section===s)&&(!role||p.page_role.includes(role))&&(!char||(c==='confirmed'?p.characters_confirmed:c==='candidate'?p.characters_candidate:p.characters_confirmed.concat(p.characters_candidate)).includes(char))&&(!scan||p.scan_page===+scan)&&(!printed||p.printed_page===+printed)&&(!q||qs.some(t=>p.search_text.includes(t))));render()}
function render(){const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages-1);const chunk=filtered.slice(page*pageSize,(page+1)*pageSize);$('count').textContent=filtered.length.toLocaleString()+' 个匹配页面';$('pagination').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=$('next-bottom').disabled=page>=pages-1;$('grid').innerHTML=chunk.map(p=>`<article class="card"><button class="thumb" data-open="${p.page_id}" aria-label="翻阅 ${esc(p.page_id)}"><img loading="lazy" decoding="async" src="${p.thumbnail}" alt="${esc(p.book_title)} 扫描 ${p.scan_page}"></button><div class="body"><h2>${esc(labels[p.book_id])} · 扫描 ${p.scan_page}</h2><button class="id" data-copy="${p.page_asset_id}" title="复制 asset_id">${p.page_asset_id}</button><div class="meta">${esc(p.page_id)}<br>印刷页：${esc(p.printed_page_label||'未确认')}　${esc(p.scan_variant)}<br>${esc(p.section||'章节未标定')}</div><div class="roles">${esc(p.page_role.join(' / '))}</div><div class="meta">文字已确认：${esc(p.characters_confirmed.join(', ')||'—')}<br>候选 / 上下文：${esc(p.characters_candidate.join(', ')||'—')}</div><p class="excerpt">${esc(p.ocr_excerpt||'未检测到可靠正文。原页完整保留。')}</p><div class="actions"><a href="${p.page_path}" target="_blank" rel="noopener">高清原页</a><a href="OCR/viewer.html#${p.page_id}" target="_blank" rel="noopener">OCR 文本</a><button class="id" data-open="${p.page_id}">按书翻页</button></div></div></article>`).join('')||'<div class="empty">没有匹配页面。尝试更短的关键词，或清除筛选。</div>'}
async function copy(id){try{await navigator.clipboard.writeText(id);$('toast').textContent='已复制 '+id}catch{const input=document.createElement('textarea');input.value=id;document.body.append(input);input.select();document.execCommand('copy');input.remove();$('toast').textContent='已复制 '+id}setTimeout(()=>$('toast').textContent='',2400)}
function openPage(id){current=data.pages.find(p=>p.page_id===id);if(!current)return;const p=current,book=data.pages.filter(r=>r.book_id===p.book_id&&r.scan_variant===p.scan_variant),i=book.indexOf(p);$('view-title').textContent=`${labels[p.book_id]} / 扫描 ${p.scan_page} / ${p.page_asset_id}`;$('book-prev').disabled=i===0;$('book-next').disabled=i===book.length-1;$('fullpage').src=p.page_path;$('fullpage').alt=p.book_title+' 扫描 '+p.scan_page;$('pageinfo').innerHTML=`<h2>${esc(p.page_id)}</h2><p>印刷页：${esc(p.printed_page_label||'未确认')}</p><p>${esc(p.section||'章节未标定')}</p><p>${esc(p.page_role.join(' / '))}</p><p>相关词条：${esc(p.keywords.join(' / ')||'未标定')}</p><p>文字已确认：${esc(p.characters_confirmed.join(', ')||'—')}</p><p>候选：${esc(p.characters_candidate.join(', ')||'—')}</p><p class="notice">姓名表示文字引用。图中人物、服装名称及场景仍以原页证据为准。</p><p><a href="${p.page_path}" target="_blank" rel="noopener">打开高清原页</a></p><p><a href="OCR/viewer.html#${p.page_id}" target="_blank" rel="noopener">打开 OCR</a> · <a href="${p.raw_ocr_path}" target="_blank" rel="noopener">原始 OCR</a></p><p><a href="Metadata/Pages/${p.page_id}.json" target="_blank" rel="noopener">页面来源与证据</a></p><button data-copy="${p.page_asset_id}">复制 asset_id</button><h3>OCR 辅助文本</h3><p class="minor">${esc(p.ocr_status)} · ${esc(p.ocr_language)}</p><pre>${esc(p.text||'此页没有识别出正文。')}</pre>${p.vertical_text?`<h3>竖排补充 OCR</h3><p><a href="${p.vertical_ocr_path}" target="_blank" rel="noopener">独立补充文本</a></p><pre>${esc(p.vertical_text)}</pre>`:''}`;if(!$('viewer').open)$('viewer').showModal();location.hash=p.page_id}
function flip(delta){if(!current)return;let book=data.pages.filter(r=>r.book_id===current.book_id&&r.scan_variant===current.scan_variant),i=book.indexOf(current);if(book[i+delta])openPage(book[i+delta].page_id)}
document.addEventListener('click',e=>{let n=e.target.closest('[data-open],[data-copy],[data-book],[data-scan]');if(!n)return;if(n.dataset.open)openPage(n.dataset.open);if(n.dataset.copy)copy(n.dataset.copy);if(n.dataset.book){$('book').value=n.dataset.book;updateBook()}if(n.dataset.scan){$('scan').value=n.dataset.scan;apply();let p=filtered[0];if(p)openPage(p.page_id)}});$('book').onchange=updateBook;['variant','section','role','character','certainty','scan','printed'].forEach(id=>$(id).onchange=apply);['scan','printed'].forEach(id=>$(id).oninput=apply);$('search').onclick=apply;$('query').onkeydown=e=>{if(e.key==='Enter')apply()};let debounce;$('query').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(apply,180)};$('prev').onclick=()=>{page--;render()};$('next').onclick=$('next-bottom').onclick=()=>{page++;render();window.scrollTo({top:200,behavior:'auto'})};$('book-prev').onclick=()=>flip(-1);$('book-next').onclick=()=>flip(1);$('close').onclick=()=>$('viewer').close();$('viewer').addEventListener('close',()=>history.replaceState(null,'',location.pathname+location.search));document.addEventListener('keydown',e=>{if($('viewer').open&&e.target.tagName!=='INPUT'){if(e.key==='ArrowLeft')flip(-1);if(e.key==='ArrowRight')flip(1)}});$('reset').onclick=()=>{['book','section','role','character','certainty','scan','printed','query'].forEach(id=>$(id).value='');$('variant').value='PRIMARY';updateBook()};updateBook();if(location.hash)openPage(decodeURIComponent(location.hash.slice(1)));
</script></body></html>
