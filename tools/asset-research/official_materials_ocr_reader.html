<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSN OCR 阅读</title><style>body{max-width:1000px;margin:32px auto;padding:0 24px;background:#edf2f6;color:#21384b;font:16px/1.7 "Segoe UI","Yu Gothic UI","Microsoft YaHei",sans-serif}a{color:#793d58;text-underline-offset:3px}nav{display:flex;gap:20px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:24px;border:1px solid #bdcad6;font:16px/1.9 "Yu Gothic UI","Microsoft YaHei",sans-serif}.note{font-size:14px;color:#526778}h1{font-size:26px}a:focus-visible{outline:3px solid #ab5d21;outline-offset:3px}</style></head><body><nav><a id="page">返回原页</a><a id="normalized" download>下载规范化 TXT</a><a id="raw" download>下载原始 TXT</a></nav><h1 id="title"></h1><p id="context"></p><p class="note">OCR 是辅助文本，可能存在漏字、误字或阅读顺序问题。原始文字和置信度证据独立保留；原页仍是主要参考。</p><pre id="text"></pre><section id="vertical" hidden><h2>竖排补充 OCR</h2><p class="note">这是独立补充识别结果，首次有效识别保留在上方。</p><pre id="vertical-text"></pre></section><script src="../catalog.js"></script><script>const id=decodeURIComponent(location.hash.slice(1)),p=window.OFFICIAL_MATERIALS.pages.find(x=>x.page_id===id),$=id=>document.getElementById(id);if(p){$('title').textContent=p.page_id+' / '+p.page_asset_id;$('context').textContent=p.book_title+' · 扫描 '+p.scan_page+' · 印刷页 '+(p.printed_page_label||'未确认')+' · '+(p.section||'章节未标定');$('page').href='../index.html#'+p.page_id;$('normalized').href='../'+p.ocr_path;$('raw').href='../'+p.raw_ocr_path;$('text').textContent=p.text||'此页未检测到正文。';if(p.vertical_text){$('vertical').hidden=false;$('vertical-text').textContent=p.vertical_text}}else{$('title').textContent='页面未找到';$('page').href='../index.html'}</script></body></html>
