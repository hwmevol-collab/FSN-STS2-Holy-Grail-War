<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSN Animation References</title>
<style>
:root{--bg:#0b1421;--panel:#142338;--text:#eaf0f8;--muted:#b4c3d6;--line:#334761;--accent:#e2c477;--blue:#80b9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:28px 4vw 22px;border-bottom:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center}h1{font:500 clamp(24px,3vw,38px)/1.2 Georgia,serif;margin:5px 0}header p{margin:8px 0;color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent)}main{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px 4vw}aside{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:10px;height:fit-content;position:sticky;top:20px}label{display:block;font-size:14px;color:var(--muted);margin:0 0 14px}input,select,button,textarea{font:inherit}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text);min-height:44px}button,.link{cursor:pointer;padding:10px 13px;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;text-decoration:none}button:hover,.link:hover{border-color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.searchbar{display:flex;gap:10px;align-items:center}.searchbar input{margin:0;font-size:18px;padding:14px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:15px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}.card{border:1px solid var(--line);background:var(--panel);border-radius:9px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:contain;background:black;display:block}.cardbody{padding:14px}.id{font:12px/1.6 Consolas,monospace;overflow-wrap:anywhere;color:var(--blue)}.time{color:var(--accent);font-family:Consolas,monospace;font-size:15px}.excerpt{color:var(--muted);font-size:14px;min-height:44px}.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:9px 0}.chip{border:1px solid var(--line);border-radius:4px;padding:3px 6px}.card button{width:100%;text-align:left}.pagination{display:flex;justify-content:center;align-items:center;gap:16px;padding:24px}.note{font-size:13px;color:var(--muted)}.stats{color:var(--accent);white-space:nowrap}.status{min-height:24px;color:var(--accent)}dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;width:min(1100px,95vw);max-height:92vh;padding:24px}dialog::backdrop{background:#000b}.detailgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}.detailgrid img{width:100%;max-height:450px;object-fit:contain;background:black}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.subtitle{border-top:1px solid var(--line);padding:10px 0;white-space:pre-wrap}.source{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px;resize:vertical}.close{float:right}.sheets img{width:100%}.empty{padding:70px 20px;text-align:center;color:var(--muted)}a{color:var(--blue)}@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static;display:grid;grid-template-columns:1fr 1fr;gap:0 15px}header{display:block}.detailgrid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){button,.link{transition:border-color .15s}}
</style>
<header><div><div class="eyebrow">FSN MASTER ASSET LIBRARY · ANIMATION</div><h1>Animation Reference Index</h1><p>从字幕与镜头，回到原始素材的精确时间点。</p></div><div id="stats" class="stats">加载引用库…</div></header>
<main><aside aria-label="筛选"><label>作品<select id="work"><option value="">全部作品</option></select></label><label>集数 / 媒体<select id="media"><option value="">全部媒体</option></select></label><label>媒体类型<select id="type"><option value="">全部类型</option></select></label><label>字幕语言<select id="language"><option value="">全部语言</option></select></label><label>Motion 最小值<input id="motionMin" type="number" step="0.1" min="0" value="0"></label><label>Motion 最大值<input id="motionMax" type="number" step="0.1" min="0" placeholder="不限"></label><label>对白密度<select id="dialogue"><option value="">全部</option><option value="none">无文本字幕</option><option value="dense">每秒 10 字以上</option><option value="text">有文本字幕</option></select></label><label>章节<select id="chapter"><option value="">全部章节</option></select></label><label>证据状态<select id="evidence"><option value="">全部</option><option value="mention">字幕提及</option><option value="confirmed">画面人物已确认</option><option value="review">待审候选</option><option value="unreviewed">未审阅</option></select></label><label>术语命中<select id="term"><option value="">全部术语</option></select></label><button id="reset">清除筛选</button><p class="note">字幕提及 ≠ 画面出现<br>高 Motion ≠ 战斗<br>自动 Shot ≠ 语义 Scene</p><a class="link" href="Reports/ANIMATION_REFERENCE_SUMMARY.html">查看统计与验收</a></aside>
<section><label class="searchbar" for="query"><input id="query" placeholder="Lancer · Gae Bolg · 投影 · 字幕原文 · shot ID · 时间码" aria-label="搜索引用库"><button id="searchButton">搜索</button></label><div class="toolbar"><div id="count" aria-live="polite">正在加载…</div><div><button id="shotsView">镜头</button> <button id="sheetsView">Contact Sheets</button></div></div><div id="status" class="status" aria-live="polite"></div><div id="results" class="grid"></div><div class="pagination"><button id="prev">上一页</button><span id="page">—</span><button id="next">下一页</button></div></section></main>
<dialog id="detail"><button id="close" class="close">关闭</button><div id="detailContent"></div></dialog>
<script src="Browser/data.js"></script><script>
const $=id=>document.getElementById(id),D=window.ANIMATION_DATA,norm=s=>{let out='',latin=false;for(const c of String(s||'').normalize('NFKC').normalize('NFKD').toLowerCase()){if(/\p{M}/u.test(c)){if(!latin)out+=c}else{out+=c;latin=/\p{Script=Latin}/u.test(c)}}return out.normalize('NFC')},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=1,filtered=[],view='shots',token='',lastFocus=null;const pageSize=24,mediaMap=new Map(D.media.map(r=>[r.media_asset_id,r]));D.shots.forEach(s=>{const r=mediaMap.get(s.media_asset_id);s.episode=r.episode_label;s.media_type=r.media_type;s.filename=r.filename;s.source_path=r.source_path;s.source_sha256=r.sha256});const chapterMap=new Map((D.chapters||[]).map(c=>[c.chapter_id,c]));
function option(select,label,value){const o=document.createElement('option');o.textContent=label;o.value=value;$(select).append(o)}
D.works.forEach(w=>option('work',w.canonical_local_title,w.work_id));[...new Set(D.media.map(r=>r.media_type))].sort().forEach(t=>option('type',t,t));[...new Set(D.shots.flatMap(s=>s.languages))].sort().forEach(l=>option('language',l,l));[...new Set(D.shots.flatMap(s=>s.term_hits))].sort().forEach(t=>option('term',t,t));[...new Set(D.shots.map(s=>s.chapter_id).filter(Boolean))].sort().forEach(t=>{const c=chapterMap.get(t);option('chapter',c?c.media_asset_id+' · '+c.title+' · '+new Date(c.start*1000).toISOString().slice(11,23):t,t)});
$('stats').textContent=`${D.summary.works} 作品 · ${D.summary.media} 媒体 · ${D.summary.shots.toLocaleString()} 镜头${D.summary.coverage<D.summary.media?' · 生成中 '+D.summary.coverage+'/'+D.summary.media:''}`;
function updateMedia(){const old=$('media').value;$('media').innerHTML='<option value="">全部媒体</option>';D.media.filter(r=>!$('work').value||r.work_id===$('work').value).forEach(r=>option('media',r.media_asset_id+' · '+r.episode_label,r.media_asset_id));if([...$('media').options].some(x=>x.value===old))$('media').value=old}
function aliasQueries(q){let qs=[norm(q)];D.aliases.forEach(a=>{if(norm(a.canonical_alias)===norm(q)||norm(a.matched_term)===norm(q)){qs.push(norm(a.canonical_alias));D.aliases.filter(b=>b.canonical_alias===a.canonical_alias).forEach(b=>qs.push(norm(b.matched_term)))}});return [...new Set(qs)]}
function queryMatch(text,q){return /^[a-z0-9 .'-]+$/.test(q)&&/[a-z]/.test(q)&&!q.startsWith('ani-')&&!q.startsWith('fsn')?new RegExp('(^|[^a-z0-9])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^a-z0-9])').test(text):text.includes(q)}
function filter(){page=1;const q=$('query').value.trim(),qs=aliasQueries(q),w=$('work').value,m=$('media').value,t=$('type').value,l=$('language').value,e=$('evidence').value,term=$('term').value,ch=$('chapter').value,min=Number($('motionMin').value||0),max=$('motionMax').value?Number($('motionMax').value):Infinity,dl=$('dialogue').value;filtered=D.shots.filter(s=>(!q||qs.some(x=>queryMatch(s.search,x)))&&(!w||s.work_id===w)&&(!m||s.media_asset_id===m)&&(!t||s.media_type===t)&&(!l||s.languages.includes(l))&&s.motion_score>=min&&s.motion_score<=max&&(!term||s.term_hits.includes(term))&&(!ch||s.chapter_id===ch)&&(!dl||(dl==='none'?s.subtitle_char_count===0:dl==='text'?s.subtitle_char_count>0:s.subtitle_char_count/Math.max(.001,s.duration)>=10))&&(!e||(e==='mention'?s.term_hits.length>0:e==='confirmed'?s.characters_present_confirmed.length>0:e==='review'?s.review_reasons.length>0:s.semantic_status==='unreviewed')));render()}
function relative(p){return p.replace(/^E:[\\/]FSN_MASTER_ASSET_LIBRARY[\\/]AnimationReferences[\\/]/i,'').replaceAll('\\','/')}
function render(){const results=$('results');let rows=filtered;if(view==='sheets'){const ids=new Set(filtered.map(s=>s.media_asset_id));rows=D.sheets.filter(s=>ids.has(s.media_asset_id));results.className='grid sheets'}else results.className='grid';const total=Math.ceil(rows.length/pageSize);page=Math.max(1,Math.min(page,total||1));$('count').textContent=`${filtered.length.toLocaleString()} 个镜头${view==='sheets'?' · '+rows.length+' 张索引图':''}`;$('page').textContent=`${page} / ${total||1}`;$('prev').disabled=page===1;$('next').disabled=page>=total;results.innerHTML=rows.slice((page-1)*pageSize,page*pageSize).map(s=>view==='sheets'?`<article class="card"><a href="${esc(relative(s.path))}" target="_blank"><img loading="lazy" src="${esc(relative(s.path))}" alt="${esc(s.media_asset_id)} ${s.type} page ${s.page}"></a><div class="cardbody">${esc(s.media_asset_id)} · ${s.type==='uniform_overview'?'均匀采样概览':'Shot Contact Sheet'} · ${s.page}</div></article>`:`<article class="card"><img loading="lazy" src="${esc(s.thumbnail)}" alt="${esc(s.work_id+' '+s.episode+' '+s.start_time)}"><div class="cardbody"><div class="id">${esc(s.shot_id)}</div><div>${esc(s.work_id)} · ${esc(s.episode)}</div><div class="time">${s.start_time} → ${s.end_time}</div><div class="note">${s.duration.toFixed(3)} 秒 · Motion ${s.motion_score.toFixed(3)} · ${s.subtitle_line_count} 字幕行</div><div class="chips">${s.term_hits.slice(0,6).map(t=>`<span class="chip">字幕提及 ${esc(t)}</span>`).join('')}</div><p class="excerpt">${esc(s.subtitle_excerpt||'无文本字幕')}</p><button data-shot="${esc(s.shot_id)}">查看镜头与完整字幕</button></div></article>`).join('')||'<div class="empty">没有符合条件的引用。可清除筛选或改用原文搜索。</div>';results.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>openShot(b.dataset.shot));history.replaceState(null,'','#'+new URLSearchParams({q:$('query').value,work:$('work').value,media:$('media').value,page,view}))}
async function copy(s){await navigator.clipboard.writeText(s);$('status').textContent='已复制：'+s.slice(0,100)}
function openShot(id){const s=D.shots.find(s=>s.shot_id===id);if(!s)return;lastFocus=document.activeElement;const r=mediaMap.get(s.media_asset_id),sheets=D.sheets.filter(c=>c.media_asset_id===s.media_asset_id);$('detailContent').innerHTML=`<h2>${esc(s.work_id)} · ${esc(s.episode)}</h2><div class="id">${esc(s.shot_id)}</div><div class="detailgrid"><div><img src="${esc(s.thumbnail)}" alt="镜头代表帧"><div class="time">${s.start_time} → ${s.end_time} · ${s.duration.toFixed(3)} 秒</div><p class="note">代表帧 ${s.representative_frame} · PTS ${s.representative_pts} / ${esc(s.pts_time_base)}<br>源 SHA-256：${esc(s.source_sha256)}</p><div class="actions"><button id="copyId">复制 shot ID</button><button id="copyTime">复制时间点</button><button id="copyPath">复制源路径</button><button id="copyHelper">复制播放命令</button><button id="play">打开本地播放器</button></div><label>原始视频路径<textarea class="source" id="sourcePath" rows="4" readonly>${esc(s.source_path)}</textarea></label><p class="note">${esc(s.filename)}<br>${r.width}×${r.height} · ${esc(r.video_codec)} · ${esc(s.media_asset_id)}</p><div class="actions">${sheets.filter(c=>c.type==='uniform_overview'||(c.first_shot_id<=s.shot_id&&c.last_shot_id>=s.shot_id)).map(c=>`<a class="link" href="${esc(relative(c.path))}" target="_blank">${c.type==='uniform_overview'?'媒体概览':'Contact Sheet '+c.page}</a>`).join('')}</div></div><div><h3>证据与提及</h3><p>字幕人物提及：${esc(s.characters_mentioned.join('、')||'无')}</p><p>画面人物已确认：${esc(s.characters_present_confirmed.join('、')||'未确认')}</p><p>术语提及：${esc(s.term_hits.join('、')||'无')}</p><p class="note">${esc(s.review_reasons.join(' / ')||'unreviewed')}<br>字幕提及只证明文本出现该名字。动作与人物画面标签需审阅。</p><h3>完整重叠字幕</h3>${s.subtitles.map(id=>D.subtitles[id]).map(l=>`<div class="subtitle"><span class="note">${esc(l.language)} · ${l.start_time}–${l.end_time} ${esc(l.speaker_field||'')}</span><br>${esc(l.plain_text)}<details><summary>原始文本与字幕标识</summary><div class="id">${esc(l.line_id)}</div>${esc(l.raw_text)}</details></div>`).join('')||'<p>该镜头没有可用文本字幕。</p>'}</div></div>`;$('copyId').onclick=()=>copy(s.shot_id);$('copyTime').onclick=()=>copy(s.start_time);$('copyPath').onclick=()=>copy(s.source_path);$('copyHelper').onclick=()=>copy(`& 'E:\\FSN_MASTER_ASSET_WORK\\scripts\\OPEN_ANIMATION_REFERENCE.ps1' -ShotId '${s.shot_id}'`);$('play').onclick=async()=>{try{const res=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json','X-Animation-Token':token},body:JSON.stringify({shot_id:s.shot_id})});if(!res.ok)throw Error(await res.text());$('status').textContent='已打开播放器：'+s.start_time}catch(e){$('status').textContent='请使用“复制播放命令”，或通过本地启动器打开索引。'}};$('detail').showModal();const p=new URLSearchParams(location.hash.slice(1));p.set('shot',id);history.replaceState(null,'','#'+p)}
$('close').onclick=()=>{$('detail').close();lastFocus?.focus()};$('detail').addEventListener('close',()=>{lastFocus?.focus();const p=new URLSearchParams(location.hash.slice(1));p.delete('shot');history.replaceState(null,'','#'+p)});$('work').onchange=()=>{updateMedia();filter()};['media','type','language','dialogue','evidence','term','chapter','motionMin','motionMax'].forEach(k=>$(k).onchange=filter);let timer;$('query').oninput=()=>{clearTimeout(timer);timer=setTimeout(filter,200)};$('searchButton').onclick=filter;$('prev').onclick=()=>{page--;render();$('results').scrollIntoView({block:'start'})};$('next').onclick=()=>{page++;render();$('results').scrollIntoView({block:'start'})};$('shotsView').onclick=()=>{view='shots';page=1;render()};$('sheetsView').onclick=()=>{view='sheets';page=1;render()};$('reset').onclick=()=>{['query','work','media','type','language','dialogue','evidence','term','chapter','motionMax'].forEach(k=>$(k).value='');$('motionMin').value=0;updateMedia();filter()};updateMedia();const params=new URLSearchParams(location.hash.slice(1));$('query').value=params.get('q')||'';$('work').value=params.get('work')||'';updateMedia();$('media').value=params.get('media')||'';view=params.get('view')||'shots';filter();page=Number(params.get('page'))||1;render();if(params.get('shot'))openShot(params.get('shot'));if(location.protocol!=='file:')fetch('/api/config').then(r=>r.json()).then(d=>token=d.token).catch(()=>{});
</script></html>
