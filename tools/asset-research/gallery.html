<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSN Master Asset Library</title>
<style>
:root{--bg:#f2f3f5;--surface:#fff;--text:#171b25;--muted:#4b5362;--line:#d3d8e0;--accent:#1d4c9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}a{color:var(--accent)}header{background:#172238;color:#fff;padding:24px 32px}header h1{margin:0;font-size:25px}header p{margin:4px 0 12px;color:#d6deec}header a{color:#d9e6ff;margin-right:22px}.toolbar{padding:20px 32px;background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.toolbar .search{grid-column:span 2}label{display:block;font-size:14px;color:var(--muted)}input,select,button{font:inherit;min-height:44px;border:1px solid #8994a6;border-radius:5px;padding:8px 10px;width:100%;background:#fff;color:var(--text)}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #316cbd;outline-offset:3px}button{width:auto;cursor:pointer}button:hover{background:#e8effa}button:disabled{cursor:default;color:#687384;background:#eceff3}.summary{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px 32px}.summary #count{margin-right:auto}main{padding:0 32px 32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}.preview{height:180px;background-color:#e9ecf1;background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff 75%),linear-gradient(-45deg,transparent 75%,#fff 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;display:flex;align-items:center;justify-content:center}.preview img{max-width:100%;max-height:180px;object-fit:contain}.preview span{font-size:30px;color:#485369}.body{padding:14px}.id{font-size:13px;font-weight:700;color:#34517e}.filename{font-size:16px;font-weight:600;overflow-wrap:anywhere;margin:3px 0 8px}.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.links a{font-size:14px;padding:5px 0}audio,video{max-width:100%;width:100%;margin:10px 0}#loading{padding:30px}.skip{position:absolute;top:-100px}.skip:focus{top:10px;left:10px;background:#fff;padding:12px;z-index:9}.error{padding:25px;background:#fff2ea;color:#7c300d}.empty{padding:50px;text-align:center;background:#fff}.compact .preview{display:none}@media(max-width:650px){header,.toolbar,.summary,main{padding-left:16px;padding-right:16px}.toolbar .search{grid-column:1/-1}.grid{grid-template-columns:1fr}}
</style></head><body><a class="skip" href="#assets">跳到素材列表</a><header><h1>FSN Master Asset Library</h1><p>原版与 REMASTERED · 每份素材保留封包来源和历史版本</p><a href="contact_sheets.html">联系表</a><a href="../Metadata/ASSET_CATALOG.csv">完整资产表</a><a href="../Reports/FINAL_REPORT.md">验收报告</a></header>
<form class="toolbar" id="filters"><div class="search"><label for="query">搜索编号、文件名、路径、脚本场景</label><input id="query" placeholder="FSN000342 / bgm01 / セイバー" type="search"></div><div><label for="version">版本</label><select id="version"></select></div><div><label for="route">路线</label><select id="route"></select></div><div><label for="category">类别</label><select id="category"></select></div><div><label for="format">格式</label><select id="format"></select></div><div><label for="container">来源包</label><select id="container"></select></div><div><label for="resolution">分辨率</label><select id="resolution"><option value="">全部</option><option value="hd">宽度 ≥ 1280</option><option value="fullhd">宽度 ≥ 1920</option><option value="small">宽度 &lt; 512</option><option value="alpha">图片素材</option></select></div><div><label for="minwidth">最小宽度</label><input id="minwidth" type="number" min="0" placeholder="不限"></div><div><label for="view">显示</label><select id="view"><option value="grid">缩略图</option><option value="compact">紧凑列表</option></select></div></form>
<div class="summary"><span id="count" role="status" aria-live="polite">正在加载全库索引…</span><button id="reset">重置筛选</button><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><main id="assets"><div id="loading">正在读取本地索引。首次加载需要几秒。</div><div id="grid" class="grid"></div></main>
<script src="catalog.js"></script><script>
'use strict';
const M=window.FSN_META,A=window.FSN_ASSETS,$=id=>document.getElementById(id),size=60;let matches=[],page=0,timer;
function options(id,items){const select=$(id);select.add(new Option('全部',''));items.forEach((s,i)=>select.add(new Option(s,i)));}
function pathLink(path){return '../'+path.split('/').map(encodeURIComponent).join('/');}
function text(parent,tag,cls,value){const el=document.createElement(tag);el.className=cls;el.textContent=value;parent.append(el);return el;}
function filter(){const q=$('query').value.trim().toLocaleLowerCase(),min=Number($('minwidth').value)||0,res=$('resolution').value;const conditions=[['version',1],['container',2],['category',5],['route',6],['format',7]].map(([id,col])=>[col,$(id).value]);matches=A.filter(a=>conditions.every(([col,v])=>v===''||a[col]===Number(v))&&(!q||(a[0]+' '+a[3]+' '+a[14]).toLocaleLowerCase().includes(q))&&(!min||Number(a[8])>=min)&&(!res||(res==='hd'&&a[8]>=1280)||(res==='fullhd'&&a[8]>=1920)||(res==='small'&&a[8]>0&&a[8]<512)||(res==='alpha'&&!!a[11])));page=0;render();}
function render(){const grid=$('grid');grid.replaceChildren();grid.classList.toggle('compact',$('view').value==='compact');$('count').textContent=`找到 ${matches.length.toLocaleString()} / ${A.length.toLocaleString()} 条素材`;$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(matches.length/size))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=matches.length;if(!matches.length){text(grid,'p','empty','没有匹配素材。请调整搜索或筛选。');return;}const fragment=document.createDocumentFragment();for(const a of matches.slice(page*size,(page+1)*size)){const card=document.createElement('article');card.className='card';const preview=text(card,'div','preview','');const name=a[3].split('/').pop();if(a[11]){const im=document.createElement('img');im.src='thumbnails/'+a[11];im.alt=name;im.loading='lazy';im.width=240;im.height=180;preview.append(im);}else{text(preview,'span','',M.categories[a[5]]);}const body=text(card,'div','body','');text(body,'div','id',a[0]);text(body,'h2','filename',name);if(a[14]&&a[14]!==name.replace(/\.[^.]+$/,''))text(body,'div','meta',a[14]);text(body,'div','meta',`${M.versions[a[1]]} · ${M.routes[a[6]]}`);text(body,'div','meta',`${M.categories[a[5]]} · ${M.formats[a[7]]}${a[8]?' · '+a[8]+' × '+a[9]:''}${a[10]?' · '+a[10]+' 秒':''}`);text(body,'div','meta',M.containers[a[2]]+' · '+a[13]);const working=a[4]||a[3];if(/\.(ogg|wav|mp3|flac)$/i.test(working)){const media=document.createElement('audio');media.controls=true;media.preload='none';media.src=pathLink(working);media.setAttribute('aria-label',name);body.append(media);}else if(/\.(mp4|webm|ogv)$/i.test(working)){const media=document.createElement('video');media.controls=true;media.preload='none';media.src=pathLink(working);media.setAttribute('aria-label',name);body.append(media);}const links=text(body,'div','links','');for(const [label,path]of [['打开工作版',a[4]],['打开原始文件',a[3]]])if(path){const link=document.createElement('a');link.href=pathLink(path);link.textContent=label;link.target='_blank';link.rel='noopener';links.append(link);}const copy=document.createElement('button');copy.textContent='复制编号';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(a[0]);copy.textContent='已复制';}catch{const field=document.createElement('input');field.value=a[0];body.append(field);field.select();document.execCommand('copy');field.remove();copy.textContent='已复制';}});links.append(copy);fragment.append(card);}grid.append(fragment);}
try{if(!M||!A)throw new Error('本地 catalog.js 未能加载');options('version',M.versions);options('route',M.routes);options('category',M.categories);options('format',M.formats);options('container',M.containers);$('filters').addEventListener('submit',e=>e.preventDefault());$('query').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(filter,180);});for(const id of ['version','route','category','format','container','resolution','minwidth'])$(id).addEventListener('change',filter);$('view').addEventListener('change',render);$('reset').addEventListener('click',()=>{$('filters').reset();filter();});$('prev').addEventListener('click',()=>{page--;render();});$('next').addEventListener('click',()=>{page++;render();});$('loading').remove();filter();}catch(error){$('loading').className='error';$('loading').textContent='无法加载索引：'+error.message+'。请确保 index.html 与 catalog.js 位于同一目录。';}
</script></body></html>
